[project]
name = "conflict-solver"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "geoalchemy2>=0.20.0",
    "geopandas>=1.1.4",
    "openpyxl>=3.1.5",
    "psycopg2-binary>=2.9.12",
    "sqlalchemy>=2.0.51",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `src` is a PEP 420 namespace package (no __init__.py), so the repo root must be importable.
# This is pytest's equivalent of the sys.path prepend every script in src/ does by hand.
pythonpath = ["."]
addopts = "-q"
