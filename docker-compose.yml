services:
  db:
    image: postgis/postgis:17-3.5
    container_name: conflitos_agrarios_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: conflitos_agrarios
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d conflitos_agrarios"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
