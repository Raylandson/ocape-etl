services:
  db:
    image: postgis/postgis:17-3.5
    container_name: conflitos_agrarios_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: conflitos_agrarios
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d conflitos_agrarios"]
      interval: 5s
      timeout: 5s
      retries: 5

  martin:
    image: maplibre/martin:latest
    container_name: conflitos_agrarios_martin
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/conflitos_agrarios
    depends_on:
      db:
        condition: service_healthy

  # Unified search API (src/search_api.py) backing the map's search bar
  search:
    image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
    container_name: conflitos_agrarios_search
    restart: always
    working_dir: /app
    command: >
      uv run --no-project
      --with fastapi --with uvicorn --with sqlalchemy --with psycopg2-binary
      uvicorn src.search_api:app --host 0.0.0.0 --port 7055
    ports:
      - "7055:7055"
    environment:
      - DATABASE_URL=postgresql+psycopg2://postgres:postgres@db:5432/conflitos_agrarios
    volumes:
      - ./src:/app/src:ro
      - uvcache:/root/.cache/uv
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  uvcache:

