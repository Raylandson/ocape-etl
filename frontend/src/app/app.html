<div id="map" class="map-container"></div>

<!-- Left Side Floating Panels (DataJud Legend & SIGEF Casos Analisados Filter) -->
<div class="left-panels-stack">
  <app-datajud-legend [isVisible]="isDataJudVisible()"></app-datajud-legend>
  <app-sigef-batateiras-filter 
    [isVisible]="isSigefCasosAnalisadosVisible()"
    (filterChanged)="onSigefFilterChanged($event)">
  </app-sigef-batateiras-filter>
</div>

<!-- Floating Toggle Button when panel is closed -->
@if (!isPanelOpen) {
  <button class="panel-toggle-badge" (click)="togglePanel()" title="Abrir painel de camadas">
    <svg class="toggle-badge-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7" />
    </svg>
    <span class="toggle-badge-text">Camadas</span>
    <span class="toggle-badge-count">{{ getActiveLayersCount() }}</span>
  </button>
}

<!-- Main Layer Panel -->
<div class="legend-panel" [class.panel-hidden]="!isPanelOpen">
  <div class="legend-header">
    <div class="legend-header-text">
      <h3>Mapeamento de Conflitos</h3>
      <p>Painel de Camadas (Pernambuco)</p>
    </div>
    <button class="close-panel-btn" (click)="togglePanel()" title="Ocultar painel">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>
  </div>
  <div class="legend-body">
    @for (layer of layers; track layer.id) {
      <div class="legend-item" (click)="toggleLayer(layer)">
        <input 
          type="checkbox" 
          [checked]="layer.visible"
          class="layer-checkbox"
        />
        <div 
          class="color-indicator" 
          [style.backgroundColor]="layer.fillColor"
          [style.borderColor]="layer.borderColor"
        ></div>
        <span class="layer-name" [class.disabled]="!layer.visible">
          {{ layer.name }}
        </span>
        @if ((layer.id === 'car_casos_analisados' || layer.id === 'sigef_casos_analisados') && layer.visible) {
          <button class="layer-focus-btn" (click)="focusBatateiras($event)" title="Aproximar visualização no mapa">
            Focar
          </button>
        }
      </div>
    }
  </div>
</div>
