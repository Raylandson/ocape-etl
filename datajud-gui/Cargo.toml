[package]
name = "datajud-gui"
version = "0.1.0"
edition = "2024"

[dependencies]
csv = "1.4.0"
eframe = { version = "0.33.3", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "blocking", "rustls"] }
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
