[package]
name = "datajud-gui"
version = "0.1.0"
edition = "2024"

[dependencies]
csv = "1.4.0"
eframe = { version = "0.33", default-features = false, features = ["glow", "default_fonts", "x11", "wayland", "persistence"] }
egui_extras = { version = "0.33", default-features = false }
flate2 = "1.1.10"
rfd = "0.17.2"
rusqlite = { version = "0.40.2", features = ["bundled", "serialize"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[build-dependencies]
flate2 = "1.1.10"

[features]
embedded-snapshot = []

[profile.release]
lto = "thin"
